[project]
name = "chesterton"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "unidiff>=0.7.5",
    "libcst>=1.4",
    "coverage>=7.6",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0"]
sandbox = ["contree-sdk", "crosshair-tool>=0.0.110"]
demo = ["upstash-redis>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: talks to the real Token Factory Sandboxes service; opt in with CHESTERTON_LIVE=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chesterton"]
